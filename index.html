<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes, viewport-fit=cover" />
    <meta name="theme-color" content="#8CB369" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Almost Adult" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="description" content="Manage your todos, shopping lists, workouts, and period tracking all in one place" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <title>Almost Adult</title>
    <style>
      #splash-screen {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #8CB369 0%, #5A8F3A 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 9999;
      }
      #splash-content {
        text-align: center;
        animation: fadeIn 0.5s ease-in;
      }
      #splash-logo {
        width: 120px;
        height: 120px;
        margin: 0 auto 24px;
        animation: float 2s ease-in-out infinite;
      }
      #splash-title {
        color: white;
        font-size: 32px;
        font-weight: 700;
        margin: 0 0 8px 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      }
      #splash-subtitle {
        color: rgba(255, 255, 255, 0.9);
        font-size: 14px;
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
      }
      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }
    </style>
  </head>
  <body>
    <div id="splash-screen">
      <div id="splash-content">
        <img id="splash-logo" src="/logo.png" alt="Almost Adult" />
        <h1 id="splash-title">Almost Adult</h1>
        <p id="splash-subtitle">Loading...</p>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
